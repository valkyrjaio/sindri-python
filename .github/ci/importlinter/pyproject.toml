[project]
name = "sindri-python-ci-importlinter"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = ["import-linter>=2.15,<3"]

[tool.uv]
# Environment-only project: install the tool, never build this directory.
package = false

# import-linter enforces module boundaries. The root poe task sets PYTHONPATH=src
# so `sindri` is importable.
[tool.importlinter]
root_packages = ["sindri"]
include_external_packages = true

# Sindri parses source with the stdlib `ast` module only. The contract sees direct
# imports only, so a transitive dependency still needs review.
[[tool.importlinter.contracts]]
name = "Sindri does not import a known third-party AST library"
type = "forbidden"
source_modules = ["sindri"]
forbidden_modules = [
    "ast_grep_py",
    "astroid",
    "baron",
    "griffe",
    "jedi",
    "libcst",
    "parso",
    "redbaron",
    "rope",
    "tree_sitter",
]
